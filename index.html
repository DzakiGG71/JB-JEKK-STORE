<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JB JEKK STORE</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- FONT -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >
</head>

<body class="bg1">

  <!-- HEADER -->
  <header>

    <!-- LOGO -->
    <div class="logo">
      🔥 JB JEKK STORE
    </div>

    <!-- BUTTON HEADER -->
    <div class="header-buttons">

      <!-- LOGIN ADMIN -->
      <button
        class="admin-btn"
        id="loginBtn"
        onclick="openLogin()"
      >
        Login Admin
      </button>

      <!-- TAMBAH PRODUK -->
      <button
        class="admin-btn hidden"
        id="addProductBtn"
        onclick="openAdminPanel()"
      >
        Tambah Produk
      </button>

    </div>

  </header>

  <!-- HERO -->
  <section class="hero">

    <h1>
      Selamat Datang di
      <span>JB JEKK STORE</span>
    </h1>

    <p>
      Tempat JB keren,
      terpercaya dan realtime 😎
    </p>

  </section>

  <!-- MENU -->
  <section class="menu">

    <!-- MENU JUAL -->
    <div class="card jual-card">

      <h2>
        🛒 Jual
      </h2>

      <p>
        Hubungi seller sekarang
      </p>

      <a
        href="https://wa.me/628131123927"
        target="_blank"
      >
        <button class="buy-btn">
          WhatsApp 1
        </button>
      </a>

      <a
        href="https://wa.me/62895376735500"
        target="_blank"
      >
        <button class="buy-btn">
          WhatsApp 2
        </button>
      </a>

    </div>

    <!-- MENU BELI -->
    <div
      class="card"
      onclick="scrollToProducts()"
    >

      <h2>
        🛍️ Beli
      </h2>

      <p>
        Lihat produk realtime
      </p>

    </div>

    <!-- MENU GRUB -->
    <div
      class="card"
      onclick="openGroup()"
    >

      <h2>
        👥 Grub
      </h2>

      <p>
        Gabung grup WhatsApp
      </p>

    </div>

    <!-- MENU DONASI -->
    <div
      class="card"
      onclick="openDonasi()"
    >

      <h2>
        💸 Donasi
      </h2>

      <p>
        Support JB JEKK STORE
      </p>

    </div>

  </section>

  <!-- PANEL ADMIN -->
  <section
    class="admin-section hidden"
    id="adminPanel"
  >

    <h2>
      Tambah Produk
    </h2>

    <!-- NAMA PRODUK -->
    <input
      type="text"
      id="title"
      placeholder="Masukkan nama produk"
    >

    <!-- DESKRIPSI -->
    <textarea
      id="desc"
      placeholder="Masukkan deskripsi produk"
    ></textarea>

    <!-- GAMBAR STORAGE -->
    <input
      type="file"
      id="img"
      accept="image/*"
    >

    <!-- BUTTON TAMBAH -->
    <button
      class="save-btn"
      onclick="addProduct()"
    >
      Tambah Produk
    </button>

  </section>

  <!-- TITLE PRODUK -->
  <div class="section-title">

    🔥 Produk Realtime

  </div>

  <!-- LIST PRODUK -->
  <div
    class="products"
    id="products"
  >

    <!-- PRODUK AKAN MASUK DI SINI -->

  </div>

  <!-- BUTTON GANTI BG -->
  <button
    class="bg-btn"
    onclick="changeBg()"
  >
    🎨
  </button>

  <!-- MODAL LOGIN -->
  <div
    class="modal"
    id="loginModal"
  >

    <div class="modal-content">

      <h2>
        Login Admin
      </h2>

      <!-- USERNAME -->
      <input
        type="text"
        id="username"
        placeholder="Masukkan Username"
      >

      <!-- PASSWORD -->
      <input
        type="password"
        id="password"
        placeholder="Masukkan Password"
      >

      <!-- BUTTON LOGIN -->
      <button
        class="save-btn"
        onclick="loginAdmin()"
      >
        Login
      </button>

    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
